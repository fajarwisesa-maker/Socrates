[project]
name = "siaga"
version = "0.0.1"
description = "SIAGA - Supply Intelligence Agent for Guarding Availability (hackathon prototype)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40",
    "cedarpy>=4.12.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pulp>=2.9,<3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "rank-bm25>=0.2.2",
    "reportlab>=4.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "services", "siaga_common"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "infra/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "aws: needs real AWS credentials and network to Bedrock (skipped unless SIAGA_RUN_AWS_TESTS=1)",
]
